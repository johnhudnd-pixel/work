<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download Video</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#ffffff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:#333;
}

.container{
    width:90%;
    max-width:420px;
    background:#fff;
    padding:40px;
    border-radius:16px;
    text-align:center;
    border:1px solid #e5e7eb;
    box-shadow:0 8px 25px rgba(0,0,0,0.08);
}

.logo{
    font-size:55px;
    margin-bottom:15px;
}

h1{
    font-size:30px;
    margin-bottom:10px;
    color:#222;
}

p{
    color:#666;
    line-height:1.6;
    margin-bottom:20px;
}

button{
    width:100%;
    background:#0d6efd;
    color:#fff;
    border:none;
    padding:16px;
    font-size:18px;
    font-weight:bold;
    border-radius:10px;
    cursor:pointer;
}

button:hover{
    background:#0b5ed7;
}

.message{
    margin-top:20px;
    color:#28a745;
    font-weight:bold;
}
</style>

</head>

<body>

<div class="container">

    <div class="logo">🎥</div>

    <h1>Video Ready</h1>

    <p>
        Your video is ready to download.
        Redirecting automatically...
    </p>

    <button id="downloadBtn">
        📥 Click Here to Download Video
    </button>

    <div class="message" id="message">
        Redirecting in <span id="timer">2</span> seconds...
    </div>

</div>


<script>

const btn = document.getElementById("downloadBtn");
const message = document.getElementById("message");
const timer = document.getElementById("timer");


// Button URL
const redirectURL = "https://daubwhereupon.com/ztt69euwns?key=eb07c0cee12be5cd4f220675d0d1b9ea";


// 2 Second Auto Redirect
let seconds = 2;

let countdown = setInterval(function(){

    seconds--;

    timer.innerHTML = seconds;

    if(seconds <= 0){

        clearInterval(countdown);

        window.location.href = redirectURL;

    }

},1000);


// Button click redirect
btn.addEventListener("click", function(){

    window.location.href = redirectURL;

});


</script>

</body>
</html>
